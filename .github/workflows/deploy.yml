# CI/CD Pipeline for Agentic AI Course
# Triggers on push to main, runs tests, deploys to staging, smoke tests, promotes to production

name: Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:
  # ── Quality Gate ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          pip install ruff black
          ruff check .
          black --check .

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          pytest tests/ -v --tb=short
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_ai

  # ── Deploy to Staging ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        run: |
          railway login --token "${{ secrets.RAILWAY_TOKEN }}"
          railway link --project "$RAILWAY_PROJECT_ID"

      - name: Deploy to staging
        run: |
          railway up --service staging
        env:
          RAILWAY_ENVIRONMENT: staging

      - name: Wait for staging deployment
        run: |
          sleep 30
          railway status --service staging

  # ── Smoke Test Staging ────────────────────────────────────────
  smoke-test-staging:
    name: Smoke Test Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test
        run: |
          pip install httpx
          python scripts/smoke_test.py --env staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

  # ── Promote to Production ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && success()
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        run: |
          railway login --token "${{ secrets.RAILWAY_TOKEN }}"
          railway link --project "$RAILWAY_PROJECT_ID"

      - name: Deploy to production
        run: |
          railway up --service production
        env:
          RAILWAY_ENVIRONMENT: production

      - name: Verify production deployment
        run: |
          sleep 30
          railway status --service production

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔴 Production deployment failed! Initiating rollback..."
          railway rollback --service production
          echo "✅ Rollback complete."

  # ── Deploy Multi-Agent A2A System ─────────────────────────────
  deploy-a2a:
    name: Deploy A2A Multi-Agent System
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          railway login --token "${{ secrets.RAILWAY_TOKEN }}"
          railway link --project "$RAILWAY_PROJECT_ID"

      - name: Deploy all A2A services
        run: |
          # Deploy orchestrator
          railway up --service orchestrator
          # Deploy researcher
          railway up --service researcher-a2a
          # Deploy writer
          railway up --service writer-a2a
          # Deploy Postgres
          railway up --service postgres
          # Deploy Redis
          railway up --service redis
        env:
          RAILWAY_ENVIRONMENT: production

      - name: Validate A2A agent cards
        run: |
          pip install jsonschema
          python scripts/validate_agent_cards.py
        env:
          A2A_BASE_URL: ${{ secrets.A2A_BASE_URL }}
